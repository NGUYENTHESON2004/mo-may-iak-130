<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="authoring-tool" content="Adobe_Animate_CC">
<title>Phần mềm mô phỏng quy trình mở máy kiểm tra tham số trên máy bay Iak-130</title>

<!-- TỐI ƯU HÓA HIỂN THỊ ĐIỆN THOẠI & PWA -->
<link rel="apple-touch-icon" href="images/app_logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mở máy Iak-130">
<link rel="manifest" href="manifest.json?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />

<style>
  /* Nền ngoài cùng là MÀU ĐEN (để che các khoảng trống viền màn hình di động) */
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000000; 
    overflow: hidden;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Khung chứa tự động căn giữa - Nền TRẮNG */
  #animation_container {
    position: absolute; 
    margin: auto; 
    left: 0; right: 0; top: 0; bottom: 0;
    background-color: #FFFFFF;
  }
  
  /* Vùng vẽ Canvas bên trong - Nền TRẮNG */
  canvas {
    display: block;
    touch-action: none;
    background-color: #FFFFFF;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  /* ========================================= */
  /* HIỆU ỨNG MÀN HÌNH LOADING CHUYÊN NGHIỆP   */
  /* ========================================= */
  #loading-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #1a1a1a; color: #00E5FF;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999999; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.4s ease; 
  }
  .loader-ring {
      width: 60px; height: 60px;
      border: 5px solid rgba(0, 229, 255, 0.2);
      border-top: 5px solid #00E5FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .loader-text { 
      font-size: 18px; font-weight: bold; letter-spacing: 1px; 
      margin-bottom: 15px; color: #ffffff; 
  }
  .loader-bar-bg { 
      width: 250px; height: 8px; background: #333; 
      border-radius: 4px; overflow: hidden; 
  }
  .loader-bar-fill { 
      height: 100%; width: 0%; background: #00E5FF; 
      transition: width 0.1s linear; 
  }

  /* LỚP PHỦ YÊU CẦU CHẠM */
  #fullscreen-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.9); color: white;
      display: none; 
      flex-direction: column; justify-content: center; align-items: center;
      z-index: 999999; font-family: sans-serif;
  }
  #start-btn {
      padding: 15px 40px; font-size: 20px; font-weight: bold;
      background-color: #00E5FF; color: #000; border: none;
      border-radius: 10px; margin-top: 20px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
  }
</style>

<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>

<!-- ======================================================= -->
<!-- BỘ BIẾN CẤU HÌNH TOÀN CỤC CHO HỆ THỐNG (API & USER)     -->
<!-- ======================================================= -->
<script>
    window.serverURL = "http://localhost:5000"; 
    window.currentUserID = 1;                   
    window.ScenarioData = {
        rawData: "",                            
        rawErrors: "",                          
        lessonNames: {}                         
    };
</script>

<script src="PhanMemMoMayIak-130_HTML5 Canvas.js?1787961304618"></script>
<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
function init() {
    canvas = document.getElementById("canvas");
    anim_container = document.getElementById("animation_container");
    dom_overlay_container = document.getElementById("dom_overlay_container");
    var comp=AdobeAn.getComposition("53F44225D6471C4A95A758DABAD252FB");
    var lib=comp.getLibrary();
    var loader = new createjs.LoadQueue(false);
    loader.installPlugin(createjs.Sound);
    
    loader.addEventListener("progress", function(evt) {
        var percent = Math.round(evt.loaded * 100);
        document.getElementById("load-percent").innerText = "ĐANG TẢI DỮ LIỆU... " + percent + "%";
        document.getElementById("load-bar").style.width = percent + "%";
    });

    loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
    loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
    var lib=comp.getLibrary();
    loader.loadManifest(lib.properties.manifest);
}
function handleFileLoad(evt, comp) {
    var images=comp.getImages();    
    if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }    
}
function handleComplete(evt,comp) {
    var lib=comp.getLibrary();
    var ss=comp.getSpriteSheet();
    var queue = evt.target;
    var ssMetadata = lib.ssMetadata;
    for(i=0; i<ssMetadata.length; i++) {
        ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
    }
    exportRoot = new lib.PhanMemMoMayIak130_HTML5Canvas();
    stage = new lib.Stage(canvas);
    stage.enableMouseOver(20); 
    
    if(createjs.Touch.isSupported()) {
        createjs.Touch.enable(stage, true, false); 
    }

    fnStartAnimation = function() {
        stage.addChild(exportRoot);
        createjs.Ticker.timingMode = createjs.Ticker.RAF_SYNCHED; 
        createjs.Ticker.framerate = lib.properties.fps;
        createjs.Ticker.addEventListener("tick", stage);
    }       
    
    AdobeAn.makeResponsive(true,'both',false,1,[canvas,anim_container,dom_overlay_container]);  
    AdobeAn.compositionLoaded(lib.properties.id);
    fnStartAnimation();
    
    setTimeout(function() {
        var loadScreen = document.getElementById("loading-screen");
        loadScreen.style.opacity = "0"; 
        setTimeout(function() {
            loadScreen.style.display = "none"; 
            document.getElementById("fullscreen-overlay").style.display = "flex"; 
        }, 400); 
    }, 200);
}
function playSound(id, loop, offset) {
    return createjs.Sound.play(id, {'interrupt':createjs.Sound.INTERRUPT_EARLY, 'loop': loop, 'offset': offset});
}
</script>
</head>
<body onload="init();">

    <!-- MÀN HÌNH LOADING -->
    <div id="loading-screen">
        <div class="loader-ring"></div>
        <div id="load-percent" class="loader-text">ĐANG TẢI DỮ LIỆU... 0%</div>
        <div class="loader-bar-bg">
            <div id="load-bar" class="loader-bar-fill"></div>
        </div>
    </div>

    <!-- LỚP PHỦ YÊU CẦU CHẠM -->
    <div id="fullscreen-overlay">
        <h2>Vui lòng xoay ngang thiết bị</h2>
        <button id="start-btn">CHẠM ĐỂ BẮT ĐẦU</button>
    </div>

    <!-- Khung chứa giao diện phần mềm (Đã chỉnh lại nền trắng) -->
    <div id="animation_container" style="background-color:#FFFFFF; width:1420px; height:720px">
        <canvas id="canvas" width="1420" height="720" style="position: absolute; display: block; background-color:#FFFFFF;"></canvas>
        <div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:1420px; height:720px; position: absolute; left: 0px; top: 0px; display: block;">
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function (event) {
            if (event.scale !== 1) { event.preventDefault(); }
        }, { passive: false });

        var lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            var now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { event.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
        });

        var overlay = document.getElementById('fullscreen-overlay');
        var startBtn = document.getElementById('start-btn');
        
        function batDauHoc(e) {
            e.preventDefault(); 
            var docElm = document.documentElement;
            
            try {
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen();
                } else if (docElm.webkitRequestFullscreen) { 
                    docElm.webkitRequestFullscreen();
                } else if (docElm.mozRequestFullScreen) { 
                    docElm.mozRequestFullScreen();
                } else if (docElm.msRequestFullscreen) { 
                    docElm.msRequestFullscreen();
                }
            } catch(err) {}
            
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {});
                }
            } catch(err) {}

            try {
                var AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    var ctx = (createjs.WebAudioPlugin && createjs.WebAudioPlugin.context) 
                              ? createjs.WebAudioPlugin.context 
                              : new AudioContext();
                    
                    if (ctx.state === 'suspended') ctx.resume();

                    var oscillator = ctx.createOscillator();
                    var gainNode = ctx.createGain();
                    gainNode.gain.value = 0; 
                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    oscillator.start(0);

                    document.addEventListener('touchstart', function() {
                        if (ctx.state === 'suspended') ctx.resume();
                    }, {passive: true});
                }
            } catch(err) {}
            
            overlay.style.display = 'none';
        }

        startBtn.addEventListener('touchstart', batDauHoc, {passive: false});
        startBtn.addEventListener('click', batDauHoc);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js?v=2').catch(function(err) {});
            });
        }
    </script>
</body>
</html>
